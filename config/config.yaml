ai:
  enabled: true
  model: gpt-4o-mini
  openai_api_key: YOUR_OPENAI_KEY
alerts:
  email_enabled: false
  email_password: YOUR_PASSWORD
  email_port: 587
  email_smtp: smtp.gmail.com
  email_user: your@email.com
  min_score_alert: 75
  telegram_bot_token: YOUR_BOT_TOKEN
  telegram_chat_id: YOUR_CHAT_ID
  telegram_enabled: false
app:
  debug: false
  name: Nifty 200 Market Intelligence
  news_refresh: 60
  refresh_interval: 10
  scanner_refresh: 30
  theme: dark
  version: 1.0.0
cache:
  redis_enabled: false
  redis_url: redis://localhost:6379
  ttl: 30
database:
  postgres_url: postgresql://user:password@localhost:5432/nifty_scanner
  sqlite_path: database/nifty_scanner.db
  type: sqlite
logging:
  level: INFO
  path: logs/app.log
  retention: 7 days
  rotation: 10 MB
scanner:
  adx_period: 14
  atr_period: 14
  breakout_volume_multiplier: 1.5
  min_match_score: 40
  rs_lookback: 63
  rsi_period: 14
  vcp_lookback: 20
  volume_avg_period: 20
